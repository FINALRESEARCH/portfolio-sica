  <script>
  function applyBlurEffect() {
    // Get the list of reference elements that have the background-image
    const refElements = document.querySelectorAll('.slider-image-link-ref');
    console.log("Reference Elements Found:", refElements.length);
    // Get the target elements inside the main slider wrapper to update the background-image
    const targetElements = document.querySelectorAll('.main-slider-wrapper .project-page-image');
    console.log("Target Elements Found:", targetElements.length);
    // Check if the target elements exist
    if (targetElements.length > 0) {
      // Loop through each target element and set its background-image from the corresponding reference element
      refElements.forEach((refElement, index) => {
        if (index < targetElements.length) { // Ensure we don't exceed the target elements
          const backgroundImage = window.getComputedStyle(refElement).backgroundImage;
          console.log(`Background Image for Ref Element ${index}:`, backgroundImage);
          if (backgroundImage && backgroundImage !== 'none') {
            targetElements[index].style.backgroundImage = backgroundImage;
            console.log(`Applied Background Image to Target Element ${index}`);
          } else {
            console.warn(`No background image found for Ref Element ${index}`);
          }
        }
      });
    } else {
      console.log("Target elements not ready yet, retrying...");
      setTimeout(applyBlurEffect, 100); // Retry after 100ms
    }
  }
  // Start the blur effect application process
  applyBlurEffect();
</script>

  <!--  DESKTOP Slide Number Counter  -->
  <script>
document.addEventListener("DOMContentLoaded", () => {
  const counterText = document.querySelector(".slider-counter-text");
  // Get total slides based on .w-slide count
  function getTotalSlides() {
    return document.querySelectorAll(".w-slide").length;
  }
  function updateCounterFromAriaLabel() {
    const ariaLabel = document.querySelector(".w-slider-aria-label");
    if (ariaLabel && /\d+\s*of\s*\d+/.test(ariaLabel.textContent)) {
      const label = ariaLabel.textContent;
      // Extract current slide and total count
      const [_, currentSlide, totalSlides] = label.match(/(\d+)\s*of\s*(\d+)/);
      const counterTextContent = `${currentSlide} / ${totalSlides}`;
      counterText.textContent = counterTextContent;
    } else {
      console.log("Waiting for aria-label content to load...");
    }
  }
  // Initialize counter to "1 / totalSlides" initially
  function setInitialCounter() {
    const totalSlides = getTotalSlides();
    const initialCounterText = `1 / ${totalSlides}`;
    counterText.textContent = initialCounterText;
  }
  // Set up observer to update counter after Finsweet CMS slider loads
  function initializeCounter() {
    const ariaLabel = document.querySelector(".w-slider-aria-label");
    if (ariaLabel) {
      updateCounterFromAriaLabel(); // Initial counter update
      // Observe changes to aria-label for real-time updates
      const observer = new MutationObserver(updateCounterFromAriaLabel);
      observer.observe(ariaLabel, { childList: true, characterData: true, subtree: true });
    } else {
      console.error("Aria label element not found.");
    }
  }
  // Check periodically if Finsweet script has finished initializing
  function waitForFinsweetCompletion() {
    const slides = document.querySelectorAll(".w-slide");
    const cmsItems = document.querySelectorAll(".w-dynamic-item");
    if (slides.length > cmsItems.length && slides.length > 2) {
      console.log("Finsweet slider initialization detected.");
      setInitialCounter();  // Set initial counter to "1 / totalSlides"
      initializeCounter();  // Set up dynamic updates
    } else {
      console.log("Waiting for Finsweet slider to initialize...");
      setTimeout(waitForFinsweetCompletion, 100); // Check again after 100ms
    }
  }
  // Start waiting for Finsweet script to finish
  waitForFinsweetCompletion();
});
</script>
  <!--  Disable body scrolling when modal active  -->
  <script>
document.addEventListener("DOMContentLoaded", () => {
  const modal = document.querySelector(".main-bts-wrapper");
  function toggleBodyScroll() {
    // Check if the modal is visible
    const isModalVisible = window.getComputedStyle(modal).display !== "none";
    if (isModalVisible) {
      // Add scroll lock class to body
      document.body.classList.add("body-scroll-lock");
    } else {
      // Remove scroll lock class from body
      document.body.classList.remove("body-scroll-lock");
    }
  }
  // Initial check in case modal is visible on load
  toggleBodyScroll();
  // Observe for changes in the modal's display property
  const observer = new MutationObserver(toggleBodyScroll);
  observer.observe(modal, { attributes: true, attributeFilter: ["style", "class"] });
});
</script>
